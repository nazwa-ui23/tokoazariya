<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZARIYA - Toko Sepatu Premium</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-green: #5a7862;
            --dark-green: #2d3e32;
            --light-green: #eaf0ec;
            --accent-green: #8cae96;
            --bg-color: #f7f9f7;
            --card-bg: #ffffff;
            --text-dark: #1a241c;
            --text-muted: #6b7c70;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-dark); min-height: 100vh; position: relative; display: flex; justify-content: center; align-items: center; }
        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background-color: var(--bg-color); z-index: 2000; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .auth-card { background: #ffffff; border: 1px solid var(--light-green); padding: 35px 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 380px; text-align: center; }
        .auth-card h2 { color: var(--dark-green); margin-bottom: 8px; font-size: 1.5rem; }
        .auth-card p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }
        .admin-big-btn { display: block; width: 100%; margin: 15px 0 10px 0; padding: 14px; background: linear-gradient(135deg, var(--dark-green), var(--primary-green)); color: #ffffff; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(45, 62, 50, 0.25); transition: all 0.25s ease; text-align: center; }
    </style>
</head>
<body>
    <div id="role-selection-screen" class="auth-overlay">
        <div class="auth-card">
            <i class="fas fa-store" style="font-size: 3.5rem; color: var(--primary-green); margin-bottom: 15px;"></i>
            <h2>Toko AZARIYA</h2>
            <p>Silakan pilih akses masuk aplikasi:</p>
            <button class="admin-big-btn" onclick="location.href='buyer_auth.html'">
                <i class="fas fa-shopping-bag"></i> Masuk sebagai Pembeli
            </button>
            <button class="admin-big-btn" style="background: linear-gradient(135deg, #34495e, #2c3e50);" onclick="location.href='admin_login.html'">
                <i class="fas fa-user-shield"></i> Masuk sebagai Admin
            </button>
        </div>
    </div>
</body>
</html>
